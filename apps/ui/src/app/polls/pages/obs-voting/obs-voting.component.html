<div class="obs-voting">
  @if (pollClosed()) {
    <div class="obs-voting__closed">
      <span class="obs-voting__closed-icon">🏆</span>
      <p class="obs-voting__closed-text">Votación cerrada</p>
    </div>
  } @else if (info()) {
    <div class="obs-voting__card">
      <p class="obs-voting__eyebrow">¡Votá ya!</p>
      <h1 class="obs-voting__title">Jugador<br/>del partido</h1>

      @if (qrDataUrl()) {
        <img [src]="qrDataUrl()!" alt="QR" class="obs-voting__qr" />
      }

      <p class="obs-voting__url">{{ votingUrl }}</p>

      @if (info()!.endsAt) {
        <p class="obs-voting__closes">
          Cierra a las {{ info()!.endsAt | date:'HH:mm' }}
        </p>
      }
    </div>
  }
</div>
